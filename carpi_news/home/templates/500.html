<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#966C42">
    <title>Errore temporaneo - Ombra del Portico</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
            line-height: 1.6;
            color: #2C2C2C;
            background: linear-gradient(135deg, #FAF7F0 0%, #F4F0E8 50%, #E8E2D5 100%);
            text-align: center;
        }

        main {
            width: min(100%, 620px);
        }

        img {
            width: 220px;
            max-width: 70vw;
            height: auto;
            margin-bottom: 28px;
        }

        .error-code {
            display: block;
            margin-bottom: 10px;
            color: #966C42;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 14px;
            font-size: clamp(2rem, 8vw, 3.4rem);
            line-height: 1.1;
        }

        p {
            margin: 0 auto 26px;
            max-width: 520px;
            color: #5A5A5A;
            font-size: 1.08rem;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0.75rem 1.2rem;
            border-radius: 6px;
            background: linear-gradient(45deg, #966C42, #B8956A);
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            opacity: 0.92;
        }
    </style>
</head>
<body>
    <main>
        <img src="/static/home/images/portico_logo_nopayoff.svg" alt="Ombra del Portico">
        <span class="error-code">Errore 500</span>
        <h1>Qualcosa non ha funzionato</h1>
        <p>Stiamo lavorando per ripristinare la pagina. Nel frattempo puoi tornare alla homepage di Ombra del Portico.</p>
        <a href="/">Torna alla home</a>
    </main>
</body>
</html>
